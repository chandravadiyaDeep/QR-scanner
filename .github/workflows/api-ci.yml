name: API CI

on:
  push:
    branches: [main, "milestone-1/**"]
    paths:
      - "services/api/**"
      - "pyproject.toml"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "pyproject.toml"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test FastAPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check services/api
      - name: Lint
        run: ruff check services/api
      - name: Run tests
        run: pytest
